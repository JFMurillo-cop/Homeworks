<div class="auth-page">
  <form class="auth-card" (ngSubmit)="onSubmit()" #form="ngForm">
    <h1>Crear cuenta</h1>
    <p class="subtitle">Regístrate para empezar a organizar tus tareas</p>

    @if (error) {
      <div class="alert-error">{{ error }}</div>
    }
    @if (mismatchError()) {
      <div class="alert-error">Las contraseñas no coinciden.</div>
    }

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        name="email"
        class="form-control"
        [(ngModel)]="email"
        required
        email
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          required
          [pattern]="passwordPattern"
          #passwordField="ngModel"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
      </div>
      <p class="hint" [class.hint-error]="passwordField.dirty && passwordField.invalid">
        Mínimo 6 caracteres y al menos una mayúscula.
      </p>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirmar contraseña</label>
      <div class="password-wrap">
        <input
          id="confirmPassword"
          [type]="showConfirmPassword() ? 'text' : 'password'"
          name="confirmPassword"
          class="form-control"
          [(ngModel)]="confirmPassword"
          required
          [pattern]="passwordPattern"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleShowConfirmPassword()"
          [attr.aria-label]="showConfirmPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showConfirmPassword() ? '🙈' : '👁️' }}
        </button>
      </div>
      @if (passwordsMismatch) {
        <p class="hint hint-error">Las contraseñas no coinciden.</p>
      }
    </div>

    <button
      type="submit"
      class="btn-primary"
      [disabled]="form.invalid || submitting() || passwordsMismatch"
    >
      {{ submitting() ? 'Creando cuenta...' : 'Registrarme' }}
    </button>

    <p class="switch-link">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </form>
</div>
