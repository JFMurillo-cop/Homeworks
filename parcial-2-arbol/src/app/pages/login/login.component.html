<div class="auth-page">
  <form class="auth-card" (ngSubmit)="onSubmit()" #form="ngForm">
    <div class="brand">🗂️</div>
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Accede a tu sistema de carpetas y archivos</p>

    @if (error) {
      <div class="alert-error">{{ error }}</div>
    }

    <div class="form-group">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        type="email"
        name="email"
        class="form-control"
        [(ngModel)]="email"
        required
        email
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input
          id="password"
          [type]="showPassword() ? 'text' : 'password'"
          name="password"
          class="form-control"
          [(ngModel)]="password"
          required
          minlength="6"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleShowPassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
      </div>
    </div>

    <button type="submit" class="btn-primary" [disabled]="form.invalid || submitting()">
      {{ submitting() ? 'Ingresando...' : 'Ingresar' }}
    </button>

    <p class="switch-link">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></p>
  </form>
</div>
